server {
    listen 80;
    server_name api.youssefyouyou.com;
    return 301 https://api.youssefyouyou.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.youssefyouyou.com;
    root /var/www/youssefyouyou.com/backend/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/api.youssefyouyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.youssefyouyou.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sql|bak)$ {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

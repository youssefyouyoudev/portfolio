server {
    listen 80;
    server_name youssefyouyou.com www.youssefyouyou.com;
    return 301 https://youssefyouyou.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.youssefyouyou.com;
    return 301 https://youssefyouyou.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name youssefyouyou.com;

    ssl_certificate /etc/letsencrypt/live/youssefyouyou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youssefyouyou.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /_next/static/ {
        alias /var/www/youssefyouyou.com/frontend/.next/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
